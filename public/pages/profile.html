<header class="border-gray-400 flex-none sticky top-0 z-50 py-2 px-4 bg-white">
    <!-- TOP SECTION -->
    <div class="w-full flex items-center justify-between gap-4">
        <!-- LEFT: Profile Picture -->
        <div class="flex-shrink-0">
            <div class="w-20 h-20 rounded-full overflow-hidden shadow-lg border-2 border-brand-red">
                <img src="/src/assets/icons/profile_img.png" alt="Youssef" class="w-full h-full">
            </div>
        </div>

        <!-- MIDDLE -->
        <div class="flex-1 flex items-center justify-between gap-4">
            <!-- NAME + ROLES -->
            <div class="flex flex-col">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-medium text-brand-red font-redhat">Youssef BEN SALAH</h1>
                    <span
                        class="inline-flex items-center gap-1.5 px-2 py-0.5 bg-green-50 text-green-600 rounded-full text-xs border border-green-200">
                        <div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
                        EN LIGNE
                    </span>
                </div>
                <div class="flex flex-col gap-0.5 mt-0.5">
                    <div class="flex items-center gap-1.5 text-gray-700 text-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z" />
                        </svg>
                        <span class="font-medium">Étudiant</span>
                    </div>
                    <div class="flex items-center gap-1.5 text-brand-red text-sm">

                        <span class="font-medium">Problem Solver</span>
                    </div>
                </div>
            </div>

            <!-- STATS -->
            <div class="flex flex-col text-base mx-4" style="font-size: 15px;">
                <div>
                    <span class="font-medium text-brand-red">12</span>
                    <span class="text-gray-600 ml-1">Publications</span>
                </div>
                <div>
                    <span class="font-medium text-brand-red">25</span>
                    <span class="text-gray-600 ml-1">Commentaires</span>
                </div>
                <div>
                    <span class="font-medium text-brand-red">9</span><span class="text-gray-600 ml-1">Solutions
                        approuvées</span>
                </div>
            </div>
        </div>

        <!-- RIGHT: ACTION BUTTONS -->
        <div class="flex-shrink-0 flex flex-col gap-2">
            <button class="px-4 py-2 bg-brand-red text-white rounded-full text-sm whitespace-nowrap">
                Se Déconnecter
            </button>
            <button
                class="px-4 py-2 bg-white text-brand-red border-2 border-brand-red rounded-full text-sm whitespace-nowrap">
                Modifier Profil
            </button>
        </div>
    </div>

    <!-- Divider -->
    <hr class="border-gray-300 mt-3">

    <!-- BOTTOM: Tabs -->
    <div class="w-full mt-2">
        <!-- Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto">
            <button
                class="flex items-center gap-2 px-4 py-2 rounded-full border border-brand-red/50 text-brand-red bg-white text-sm hover:border-brand-red hover:text-red">
                <div class="w-6 h-6 flex items-center justify-center bg-white rounded-full border border-brand-red/50">
                    <img src="/src/assets/icons/post.png" alt="Icon" class="w-3 h-3">
                </div>
                Mes publications
            </button>

            <button
                class="flex items-center gap-2 px-4 py-2 rounded-full border border-brand-red/50 text-brand-red bg-white text-sm hover:border-brand-red hover:text-red">
                <div class="w-6 h-6 flex items-center justify-center bg-white rounded-full border border-brand-red/50">
                    <img src="/src/assets/icons/fav.png" alt="Icon" class="w-3 h-3">
                </div>
                Mes favoris
            </button>

            <button
                class="flex items-center gap-2 px-4 py-2 rounded-full border border-brand-red/50 text-brand-red bg-white text-sm hover:border-brand-red hover:text-red">
                <div class="w-6 h-6 flex items-center justify-center bg-white rounded-full border border-brand-red/50">
                    <img src="/src/assets/icons/repost_red.png" alt="Icon" class="w-3 h-3">
                </div>
                Mes repartages
            </button>

            <button class="flex items-center gap-2 px-4 py-2 rounded-full bg-brand-red/50 text-white text-sm">
                <div class="w-6 h-6 flex items-center justify-center bg-white rounded-full border border-brand-red/50">
                    <img src="/src/assets/icons/note_3.png" alt="Icon" class="w-3 h-3">
                </div>
                Mes Notes
            </button>
        </div>




        <!-- Container for input + sort -->
        <div class="mt-3 flex items-center  justify-center">
            <!-- Search Input -->
            <div class="mx-5 relative flex-1"> <!-- slightly bigger -->
                <input type="text" placeholder="Rechercher une note"
                    class="w-full px-4 py-2 pr-10 border-2 border-gray-300 rounded-full text-sm focus:outline-none focus:border-brand-red">

            </div>
            <button
                class="group flex items-center justify-center w-10 h-10 rounded-full transition-colors hover:bg-brand-red mr-1">
                <svg class="h-5 w-5 text-gray-600 transition-colors group-hover:text-white" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
            <!-- Sort Button -->
            <button
                class="mx-5 flex items-center justify-between px-4 py-2 border border-brand-red text-brand-red text-sm rounded-full hover:border-brand-red/50 transition-colors">
                <span id="sortText">trier par</span>
                <img src="/src/assets/icons/arrow_down_red.png" alt="Arrow" class="mx-2 w-2 h-2 rounded-full">
            </button>
        </div>



    </div>

</header>
