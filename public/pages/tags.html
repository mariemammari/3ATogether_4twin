<header class="bg-white text-white flex-none  top-0 z-50 py-6 px-4 ">
    <div class="flex items-start justify-between">
        <!-- Left: Logo, greeting, subtitle, sorting -->
        <div class="flex flex-col gap-2 w-full">

            <!-- Title with icon -->
            <div class="flex items-center gap-2 mb-4 ">
                <h1 class="text-black text-3xl font-poppins">Tags!</h1>

                <div class="flex items-center justify-center flex-shrink-0 ">
                    <img src="/src/assets/icons/tag-forme-noire.png" alt="Home Icon" class="w-6 h-6">
                </div>
            </div>

            <div class="flex items-center  justify-between w-full mg-6  ">

                <!-- Barre de recherche -->
                <div
                    class="flex w-[420px] h-10 bg-white rounded-full border border-red-500 items-center px-5  mb-4 shadow-lg">
                    <button class="flex items-center gap-2">
                        <img src="/src/assets/icons/loupe.png" class="w-5 h-5" alt="Search Icon">

                    </button>

                    <input type="text" placeholder="Search Tag"
                        class="flex-1 h-full bg-transparent outline-none text-gray-700 text-sm">
                    <button class="text-gray-400 ml-2">🎙️</button>
                </div>



                <!-- Tous les boutons alignés à droite -->
                <div class="flex items-center gap-3">

                    <!-- Bouton Java -->
                    <button
                        class="h-8 px-4 bg-gray-200 border border-gray-300 rounded-lg flex items-center gap-2 hover:bg-gray-300 transition shadow-sm">
                        <span class="w-5 h-5 bg-gray-800 rounded-full flex items-center justify-center">
                            <span class="text-white text-xs font-bold">!</span>
                        </span>
                        <span class="text-gray-800 font-medium text-sm">Java</span>
                    </button>


                    <!-- Bouton Symfony -->
                    <button
                        class="h-8 px-4 bg-gray-200 border border-gray-300 rounded-lg flex items-center gap-2 hover:bg-gray-300 transition shadow-sm">
                        <span class="w-5 h-5 bg-gray-800 rounded-full flex items-center justify-center">
                            <span class="text-white text-xs font-bold">!</span>
                        </span>
                        <span class="text-gray-800 font-medium text-sm">Symfony</span>
                    </button>
                    <!-- Bouton XAMPP -->
                    <button
                        class="h-8 px-4 bg-gray-200 border border-gray-300 rounded-lg flex items-center gap-2 hover:bg-gray-300 transition shadow-sm">
                        <span class="w-5 h-5 bg-gray-800 rounded-full flex items-center justify-center">
                            <span class="text-white text-xs font-bold">!</span>
                        </span>
                        <span class="text-gray-800 font-medium text-sm">XAMPP</span>
                    </button>

                    <!-- Bouton Trier par -->
                    <button
                        class="h-8 px-4 bg-white border border-gray-300  flex items-center gap-2 hover:bg-gray-50 transition shadow-lg">
                        <img src="/src/assets/icons/filtre.png" class="w-5 h-5" alt="Sort Icon">
                        <span class="text-gray-800 font-medium text-sm">Trier par</span>
                    </button>

                </div>
            </div>
        </div>



    </div>
</header>
